[package]
name = "shopping-sessions"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "pipeline"
path = "src/main.rs"

[dependencies]
libc = "0.2"
memchr = "2"
memmap2 = "0.9"
hashbrown = "0.15"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
